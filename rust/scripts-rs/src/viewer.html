<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>walsy-3d Turntable</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eceef1;color:#1c2026}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#eceef1}
main{max-width:880px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
#meta{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b7480}
.links{display:flex;gap:12px;white-space:nowrap;margin-left:auto}
.links a{font-size:12px;color:#4a7f8c;text-decoration:none}
.links a:hover{text-decoration:underline}
.stage{display:flex;justify-content:center;overflow:auto;border:1px solid #d7dbe0;border-radius:10px;background:#f7f8f9;padding:8px;transition:background .2s}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;cursor:grab;border-radius:4px}
canvas.dragging{cursor:grabbing}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px 16px;margin-top:14px;align-items:end}
label{font-size:12px;color:#5d6673;display:flex;flex-direction:column;gap:5px}
label.check{flex-direction:row;align-items:center;gap:6px;font-size:12px}
.out{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b939e;margin-left:auto}
.checks{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:4px}
input[type=range]{width:100%;accent-color:#4a7f8c}
input[type=number],select{width:100%;padding:4px 6px;border:1px solid #d7dbe0;border-radius:5px;background:#fff;color:inherit;font:inherit;font-size:12px}
input[type=file]{font-size:11px;color:#5d6673;max-width:100%}
button{background:#37414c;color:#f4f6f8;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;width:100%}
button:hover{filter:brightness(1.12)}
#play.playing{background:#4a7f8c}
#readout{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5d6673;margin-top:10px;min-height:18px}
footer{font-size:11px;color:#8b939e;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<main>
<header>
  <h1 id="title">walsy-3d Turntable</h1>
  <div id="meta">loading…</div>
  <div class="links"><a href="https://www.linkedin.com/in/kerem-urhan-225870436/" target="_blank" rel="noopener">my linkedin</a><a href="https://github.com/walsykerem/walsy-3d" target="_blank" rel="noopener">github star me</a></div>
</header>
<div class="stage" id="stage"><canvas id="view" width="320" height="320" role="img" aria-label="View mode"></canvas></div>
<div id="readout">loading…</div>
<div class="grid">
  <div><button id="play" type="button" class="playing" title="Space: pause / play">Pause</button></div>
  <div><button id="restart" type="button" title="Restore default controls">Restart</button></div>
  <label>Angle <span class="out" id="angleOut">35°</span>
    <input id="angle" type="range" min="0" max="360" step="1" value="35"></label>
  <label>Squash <span class="out" id="squashOut">0.75</span>
    <input id="squash" type="range" min="0.45" max="1" step="0.01" value="0.75"></label>
  <label>Spacing <span class="out" id="spacingOut">1.00</span>
    <input id="spacing" type="range" min="0" max="4" step="0.05" value="1"></label>
  <label>Scale <span class="out" id="scaleOut">6x</span>
    <input id="scale" type="range" min="2" max="14" step="1" value="6"></label>
  <label>Slices
    <input id="slices" type="number" min="1" max="256" step="1" value="36"></label>
  <label>Time <span class="out" id="timeOut">Day</span>
    <input id="time" type="range" min="0" max="100" step="1" value="40"></label>
  <label>Sun <span class="out" id="sunOut">315°</span>
    <input id="sun" type="range" min="0" max="360" step="1" value="315"></label>
  <label>Mode
    <select id="mode">
      <option value="stack">Stacked</option>
      <option value="scan">Slice scan</option>
      <option value="explode">Exploded</option>
    </select></label>
  <div class="checks">
    <label class="check"><input id="chkLight" type="checkbox" checked>Light</label>
    <label class="check"><input id="chkShadow" type="checkbox" checked>Shadow</label>
    <label class="check"><input id="chkOutline" type="checkbox" checked>Outline</label>
  </div>
  <label>Sheet <input id="file" type="file" accept="image/png,image/webp"></label>
  <div><button id="export" type="button">Export 16 angles</button></div>
</div>
<footer id="hint">drag to rotate · shift+drag for sun · vertical drag squashes · Space pause · W/A/S/D nudge</footer>
</main>
<script>
const EMBEDDED = /*__EMBEDDED_STACK__*/null;
const DEG = Math.PI / 180;
const MIN_SQ = 0.45, MAX_SINP = Math.sqrt(1 - MIN_SQ * MIN_SQ);
const sinPitch = () => Math.sqrt(Math.max(0, 1 - state.squash * state.squash));
const clampN = (v, a, b) => v < a ? a : v > b ? b : v;
const DEFAULTS = {
  angle: 35, squash: 0.75, spacing: 1, scale: 6, slices: 0, // 0 = embedded strip's slice count
  playing: true, time: 40, sun: 315, light: true, shadow: true, outline: true,
  mode: 'stack'
};
const state = { ...DEFAULTS, dirty: true, lastMs: 0 };
const ids = ['title','meta','readout','play','restart','angle','angleOut','squash','squashOut','spacing','spacingOut','scale','scaleOut','slices','time','timeOut','sun','sunOut','chkLight','chkShadow','chkOutline','mode','file','export','stage','view'];
const els = {};
for (const id of ids) els[id] = document.getElementById(id);
const view = els.view, ctx = view.getContext('2d');

let payloadSlices = 0, sliceW = 0, sliceH = 0, sheetData = null, sheetW = 0;
let frontPx = null, backPx = null, vol = null, defaultSheet = null;
let art = null, artCtx = null, artData = null, artW = 0, artH = 0;
let solid = null, glow = { r: null, g: null, b: null };
let panX = 0, panY = 0;
const sil = { front: 0, back: 0 };

const ENVS = [
  { t: 0,   bg: [12, 16, 28],    amb: [0.44, 0.50, 0.70], sun: [0.55, 0.66, 1.00], sunI: 0.92, pool: 1.5, shadowA: 0.18, outline: [8, 10, 18],  ground: [26, 30, 44] },
  { t: 40,  bg: [238, 240, 243], amb: [0.76, 0.78, 0.82], sun: [1.04, 1.01, 0.95], sunI: 1.00, pool: 0.35, shadowA: 0.34, outline: [46, 50, 58], ground: [198, 202, 208] },
  { t: 70,  bg: [250, 224, 200], amb: [0.80, 0.66, 0.58], sun: [1.26, 0.84, 0.58], sunI: 1.00, pool: 0.95, shadowA: 0.26, outline: [58, 36, 32], ground: [212, 178, 152] },
  { t: 100, bg: [12, 16, 28],    amb: [0.44, 0.50, 0.70], sun: [0.55, 0.66, 1.00], sunI: 0.92, pool: 1.5, shadowA: 0.18, outline: [8, 10, 18],  ground: [26, 30, 44] }
];

function phaseName(t){
  if (t < 22) return 'Night';
  if (t < 58) return 'Day';
  if (t < 88) return 'Sunset';
  return 'Night';
}

function envAt(t){
  const x = clampN(t, 0, 100);
  let i = 0;
  while (i < ENVS.length - 2 && x >= ENVS[i + 1].t) i++;
  const a = ENVS[i], b = ENVS[i + 1];
  const k = clampN((x - a.t) / Math.max(1e-6, b.t - a.t), 0, 1);
  const mix = (p, q) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k, p[2] + (q[2] - p[2]) * k];
  return {
    bg: mix(a.bg, b.bg), amb: mix(a.amb, b.amb), sun: mix(a.sun, b.sun),
    outline: mix(a.outline, b.outline), ground: mix(a.ground, b.ground),
    sunI: a.sunI + (b.sunI - a.sunI) * k,
    pool: a.pool + (b.pool - a.pool) * k,
    shadowA: a.shadowA + (b.shadowA - a.shadowA) * k,
    name: phaseName(x)
  };
}

function loadImage(src){
  if (!src) return Promise.resolve(null);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image load failed'));
    img.src = src;
  });
}

function pixels(img){
  const cv = document.createElement('canvas');
  cv.width = img.naturalWidth || img.width;
  cv.height = img.naturalHeight || img.height;
  const cc = cv.getContext('2d', { willReadFrequently: true });
  cc.drawImage(img, 0, 0);
  return { data: cc.getImageData(0, 0, cv.width, cv.height).data, width: cv.width, height: cv.height };
}

function buildVolume(){
  if (!sheetData) return;
  const n = clampN(state.slices | 0 || payloadSlices, 1, 256);
  state.slices = n;
  const w = sliceW, h = sliceH, len = w * h * n;
  const minX = new Int16Array(n), maxX = new Int16Array(n), minY = new Int16Array(n), maxY = new Int16Array(n);
  vol = {
    w: w, h: h, n: n,
    occ: new Uint8Array(len), r: new Uint8Array(len), g: new Uint8Array(len), b: new Uint8Array(len),
    nx: new Int8Array(len), ny: new Int8Array(len), nz: new Int8Array(len),
    ao: new Uint8Array(len), emis: new Uint8Array(len),
    foot: new Uint8Array(w * h), emisCount: 0,
    minX: minX, maxX: maxX, minY: minY, maxY: maxY
  };
  for (let z = 0; z < n; z++){
    minX[z] = w; maxX[z] = -1; minY[z] = h; maxY[z] = -1;
    const sz = n === 1 ? 0 : Math.round(z * (payloadSlices - 1) / (n - 1));
    for (let y = 0; y < h; y++){
      const rowBase = y * sheetW + sz * sliceW;
      for (let x = 0; x < w; x++){
        const si = (rowBase + x) * 4;
        if (sheetData[si + 3] < 24) continue;
        const i = (z * h + y) * w + x;
        vol.occ[i] = 1;
        vol.r[i] = sheetData[si];
        vol.g[i] = sheetData[si + 1];
        vol.b[i] = sheetData[si + 2];
        const lum = sheetData[si] * 0.3 + sheetData[si + 1] * 0.59 + sheetData[si + 2] * 0.11;
        if (lum > 196){
          const e = clampN((lum - 196) * 9, 0, 255) | 0;
          vol.emis[i] = e;
          if (e > 40) vol.emisCount++;
        }
        vol.foot[y * w + x] = 1;
        if (x < minX[z]) minX[z] = x;
        if (x > maxX[z]) maxX[z] = x;
        if (y < minY[z]) minY[z] = y;
        if (y > maxY[z]) maxY[z] = y;
      }
    }
  }
  const at = (x, y, z) => (x < 0 || y < 0 || z < 0 || x >= w || y >= h || z >= n) ? 0 : vol.occ[(z * h + y) * w + x];
  for (let z = 0; z < n; z++){
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const i = (z * h + y) * w + x;
        if (!vol.occ[i]) continue;
        vol.nx[i] = at(x + 1, y, z) - at(x - 1, y, z);
        vol.ny[i] = at(x, y + 1, z) - at(x, y - 1, z);
        vol.nz[i] = at(x, y, z + 1) - at(x, y, z - 1);
        const occ6 = at(x + 1, y, z) + at(x - 1, y, z) + at(x, y + 1, z) + at(x, y - 1, z) + at(x, y, z + 1) + at(x, y, z - 1);
        vol.ao[i] = 255 - occ6 * 26;
      }
    }
  }
  sil.front = matchMask(frontPx);
  sil.back = matchMask(backPx);
  els.meta.textContent = state.slices + ' slices · ' + sliceW + 'x' + sliceH + 'px';
}

function matchMask(img){
  if (!img || !vol) return 0;
  let hit = 0, tot = 0;
  for (let y = 0; y < vol.h; y++){
    for (let x = 0; x < vol.w; x++){
      if (!vol.foot[y * vol.w + x]) continue;
      tot++;
      const sx = Math.min(img.width - 1, Math.floor(x * img.width / vol.w));
      const sy = Math.min(img.height - 1, Math.floor(y * img.height / vol.h));
      if (img.data[(sy * img.width + sx) * 4 + 3] > 40) hit++;
    }
  }
  return tot ? Math.round(hit * 100 / tot) : 0;
}

function spread(){
  return state.spacing * (state.mode === 'explode' ? 2.2 : 1);
}

function groundY(){
  return Math.round(artH / 2 + vol.h * 0.5 * state.squash);
}

function layout(){
  if (!vol) return;
  const S = spread();
  const halfW = vol.w / 2, halfH = vol.h / 2;
  let mx = 0;
  for (let a = 0; a <= 90; a += 3){
    const c = Math.cos(a * DEG), s = Math.sin(a * DEG);
    mx = Math.max(mx, halfW * c + (vol.n - 1) * S * s * 0.5);
  }
  const maxHalfW = mx + 6;
  const maxHalfH = halfH + halfW * MAX_SINP + (vol.n - 1) * S * MAX_SINP * 0.5 + 8;
  artW = Math.ceil(maxHalfW * 2) + 4;
  artH = Math.ceil(maxHalfH * 2) + 4;
  art = document.createElement('canvas');
  art.width = artW;
  art.height = artH;
  artCtx = art.getContext('2d');
  artData = artCtx.createImageData(artW, artH);
  solid = new Uint8Array(artW * artH);
  glow = { r: new Float32Array(artW * artH), g: new Float32Array(artW * artH), b: new Float32Array(artW * artH) };
  resize();
  state.dirty = true;
}

function resize(){
  if (!artData) return;
  const s = clampN(Math.round(state.scale) || 6, 2, 14);
  view.width = artW * s;
  view.height = artH * s;
  view.style.width = (artW * s) + 'px';
  view.style.height = (artH * s) + 'px';
  ctx.imageSmoothingEnabled = false;
  state.dirty = true;
}

function background(px, env){
  const c = env.bg;
  for (let y = 0; y < artH; y++){
    const k = y / Math.max(1, artH - 1);
    const r = c[0] * (1 - 0.10 * k), g = c[1] * (1 - 0.10 * k), b = c[2] * (1 - 0.08 * k);
    const row = y * artW * 4;
    for (let x = 0; x < artW; x++){
      const o = row + x * 4;
      px[o] = r; px[o + 1] = g; px[o + 2] = b; px[o + 3] = 255;
    }
  }
}

function groundLine(px, env){
  const y = Math.min(artH - 1, groundY() + 2);
  const c = env.ground;
  for (let x = 0; x < artW; x++){
    const edge = Math.min(x, artW - 1 - x) / (artW * 0.16 + 1);
    const a = 0.55 * Math.min(1, edge);
    if (a <= 0.02) continue;
    const o = (y * artW + x) * 4;
    px[o] = px[o] * (1 - a) + c[0] * a;
    px[o + 1] = px[o + 1] * (1 - a) + c[1] * a;
    px[o + 2] = px[o + 2] * (1 - a) + c[2] * a;
  }
}

function addGlow(px, cx, cy, rad, r, g, b, k){
  for (let y = Math.max(0, cy - rad); y <= Math.min(artH - 1, cy + rad); y++){
    const dy = (y - cy) / rad;
    for (let x = Math.max(0, cx - rad); x <= Math.min(artW - 1, cx + rad); x++){
      const dx = (x - cx) / rad;
      const f = 1 - Math.sqrt(dx * dx + dy * dy);
      if (f <= 0) continue;
      const a = f * f * k;
      const o = (y * artW + x) * 4;
      px[o] = Math.min(255, px[o] + r * a);
      px[o + 1] = Math.min(255, px[o + 1] + g * a);
      px[o + 2] = Math.min(255, px[o + 2] + b * a);
    }
  }
}

// ground-plane passes (shadow, light pools) share one projection of the slice bottoms
function groundPass(px, env, ca, sa, S){
  const w = vol.w, h = vol.h, n = vol.n;
  const half = (n - 1) * 0.5;
  const zs = Math.max(1, Math.round(n / 22));
  const stepX = Math.max(1, Math.round(w / 18));
  const stepY = Math.max(1, Math.round(h / 18));
  const sr = state.sun * DEG;
  const skewX = -Math.cos(sr) * 7, skewY = -Math.sin(sr) * 2;
  const gy = groundY();
  if (state.shadow){
    const a = env.shadowA;
    for (let z = 0; z < n; z += zs){
      const off = (z - half) * S;
      for (let y = vol.h - 1; y >= 0; y -= stepY){
        for (let x = 0; x < w; x += stepX){
          if (!vol.foot[y * w + x]) continue;
          const u = x - w / 2;
          const ax = Math.round(artW / 2 + u * ca + off * sa + skewX);
          const ay = Math.round(gy + 2 + skewY + (off * sa - u * sa) * 0.05);
          if (ax < 0 || ay < 0 || ax >= artW || ay >= artH) continue;
          const o = (ay * artW + ax) * 4;
          px[o] = px[o] * (1 - a) + 18 * a;
          px[o + 1] = px[o + 1] * (1 - a) + 21 * a;
          px[o + 2] = px[o + 2] * (1 - a) + 27 * a;
          if (ax + 1 < artW){
            const o2 = o + 4;
            px[o2] = px[o2] * (1 - a) + 20 * a;
            px[o2 + 1] = px[o2 + 1] * (1 - a) + 23 * a;
            px[o2 + 2] = px[o2 + 2] * (1 - a) + 29 * a;
          }
        }
      }
    }
  }
  if (!vol.emisCount) return;
  const hz = Math.max(1, Math.round(n / 12));
  for (let z = 0; z < n; z += hz){
    const off = (z - half) * S;
    for (let y = 0; y < h; y += stepY){
      for (let x = 0; x < w; x += stepX){
        const i = (z * h + y) * w + x;
        const e = vol.emis[i];
        if (e < 120) continue;
        const u = x - w / 2;
        const ax = Math.round(artW / 2 + u * ca + off * sa);
        const ay = Math.round(gy + 1);
        addGlow(px, ax, ay, 6, vol.r[i], vol.g[i], vol.b[i], (e / 255) * env.pool * 0.4);
      }
    }
  }
}

function paintGhost(px, img, ca, sa, alpha, offsetY){
  if (!img) return;
  const w = img.width, h = img.height, cx = w / 2, cy = h / 2;
  const a = ca >= 0 ? Math.max(ca, 0.13) : Math.min(ca, -0.13);
  const invA = 1 / a, invSq = 1 / state.squash;
  const ox = artW / 2, b = sa * sinPitch();
  const base = alpha / 255;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let c = 0; c < 4; c++){
    const u = (c & 1 ? cx : -cx), vv = (c & 2 ? cy : -cy);
    const ax = ox + u * a, ay = offsetY + vv * state.squash + u * b;
    if (ax < x0) x0 = ax;
    if (ax > x1) x1 = ax;
    if (ay < y0) y0 = ay;
    if (ay > y1) y1 = ay;
  }
  const ax0 = Math.max(0, Math.floor(x0)), ax1 = Math.min(artW - 1, Math.ceil(x1));
  const ay0 = Math.max(0, Math.floor(y0)), ay1 = Math.min(artH - 1, Math.ceil(y1));
  for (let ay = ay0; ay <= ay1; ay++){
    const dy = ay - offsetY;
    const row = ay * artW;
    for (let ax = ax0; ax <= ax1; ax++){
      const u = (ax - ox) * invA;
      const sx = Math.round(u + cx), sy = Math.round((dy - u * b) * invSq + cy);
      if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
      const si = (sy * w + sx) * 4;
      const sa2 = img.data[si + 3];
      if (sa2 < 30) continue;
      const k = base * (sa2 / 255);
      const o = (row + ax) * 4;
      px[o] = px[o] * (1 - k) + img.data[si] * k;
      px[o + 1] = px[o + 1] * (1 - k) + img.data[si + 1] * k;
      px[o + 2] = px[o + 2] * (1 - k) + img.data[si + 2] * k;
    }
  }
}

function scanIndex(n){
  return Math.floor((((state.angle % 360) + 360) % 360) * n / 360) % n;
}

function visibleSlices(){
  const n = vol.n, out = [];
  if (state.mode === 'scan'){
    const half = Math.min(5, Math.max(1, Math.floor(n / 4)));
    const idx = scanIndex(n);
    for (let z = idx - half; z <= idx + half; z++) if (z >= 0 && z < n) out.push({ z: z, d: z });
    const c = Math.cos(state.angle * DEG);
    out.sort((p, q) => c >= 0 ? p.z - q.z : q.z - p.z);
  } else {
    for (let z = 0; z < n; z++) out.push({ z: z, d: z });
    const c = Math.cos(state.angle * DEG);
    out.sort((p, q) => c >= 0 ? p.z - q.z : q.z - p.z);
  }
  return out;
}

function drawSlice(px, z, ca, sa, env, L, S){
  const w = vol.w, h = vol.h, cx = w / 2, cy = h / 2;
  const mid = (vol.n - 1) * 0.5;
  const off = (z - mid) * S;
  const a = ca >= 0 ? Math.max(ca, 0.13) : Math.min(ca, -0.13);
  const invA = 1 / a;
  const ox = artW / 2 + off * sa;
  const oy = artH / 2 - off * ca * sinPitch();
  const sq = state.squash, invSq = 1 / sq;
  const b = sa * sinPitch();
  const minX = vol.minX[z], maxX = vol.maxX[z], minY = vol.minY[z], maxY = vol.maxY[z];
  if (maxX < 0) return;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let c = 0; c < 4; c++){
    const u = (c & 1 ? maxX + 1 : minX) - cx;
    const vv = (c & 2 ? maxY + 1 : minY) - cy;
    const ax = ox + u * a;
    const ay = oy + vv * sq + u * b;
    if (ax < x0) x0 = ax;
    if (ax > x1) x1 = ax;
    if (ay < y0) y0 = ay;
    if (ay > y1) y1 = ay;
  }
  const ax0 = Math.max(0, Math.floor(x0)), ax1 = Math.min(artW - 1, Math.ceil(x1));
  const ay0 = Math.max(0, Math.floor(y0)), ay1 = Math.min(artH - 1, Math.ceil(y1));
  const amb = env.amb, sunC = env.sun, sunI = env.sunI, lit = state.light;
  for (let ay = ay0; ay <= ay1; ay++){
    const dy = ay - oy;
    const row = ay * artW;
    for (let ax = ax0; ax <= ax1; ax++){
      const u = (ax - ox) * invA;
      const vv = (dy - u * b) * invSq;
      const sx = Math.round(u + cx), sy = Math.round(vv + cy);
      if (sx < minX || sx > maxX || sy < minY || sy > maxY) continue;
      const i = (z * h + sy) * w + sx;
      if (!vol.occ[i]) continue;
      const aof = vol.ao[i] / 255;
      const ambF = 0.45 + 0.55 * aof;
      let r, g, bl;
      if (lit){
        let d = vol.nx[i] * L.x + vol.ny[i] * L.y + vol.nz[i] * L.z;
        d = d > 0 ? Math.min(1.05, d * 0.55) * sunI : 0;
        r = vol.r[i] * (amb[0] * ambF + sunC[0] * d);
        g = vol.g[i] * (amb[1] * ambF + sunC[1] * d);
        bl = vol.b[i] * (amb[2] * ambF + sunC[2] * d);
      } else {
        const f = 0.55 + 0.45 * aof;
        r = vol.r[i] * f;
        g = vol.g[i] * f;
        bl = vol.b[i] * f;
      }
      const e = vol.emis[i];
      if (e){
        const k = e / 255;
        const ek = 1 + k * 1.6;
        r *= ek; g *= ek; bl *= ek;
        if (k > 0.3){
          glow.r[row + ax] += vol.r[i] * k * 0.85;
          glow.g[row + ax] += vol.g[i] * k * 0.85;
          glow.b[row + ax] += vol.b[i] * k * 0.85;
        }
      }
      const o = (row + ax) * 4;
      px[o] = r > 255 ? 255 : r;
      px[o + 1] = g > 255 ? 255 : g;
      px[o + 2] = bl > 255 ? 255 : bl;
      px[o + 3] = 255;
      solid[row + ax] = 1;
    }
  }
}

function bloom(px){
  const R = 2;
  for (let y = 0; y < artH; y++){
    const y0 = Math.max(0, y - R), y1 = Math.min(artH - 1, y + R);
    for (let x = 0; x < artW; x++){
      const x0 = Math.max(0, x - R), x1 = Math.min(artW - 1, x + R);
      let sr = 0, sg = 0, sb = 0, cnt = 0;
      for (let yy = y0; yy <= y1; yy++){
        let idx = yy * artW + x0;
        for (let xx = x0; xx <= x1; xx++, idx++){
          sr += glow.r[idx]; sg += glow.g[idx]; sb += glow.b[idx]; cnt++;
        }
      }
      if (sr + sg + sb < 3) continue;
      const inv = 0.55 / cnt;
      const o = (y * artW + x) * 4;
      px[o] = Math.min(255, px[o] + sr * inv);
      px[o + 1] = Math.min(255, px[o + 1] + sg * inv);
      px[o + 2] = Math.min(255, px[o + 2] + sb * inv);
    }
  }
}

function outlinePass(px, env){
  const c = env.outline;
  for (let y = 1; y < artH - 1; y++){
    for (let x = 1; x < artW - 1; x++){
      const i = y * artW + x;
      if (!solid[i]) continue;
      if (solid[i - 1] && solid[i + 1] && solid[i - artW] && solid[i + artW]) continue;
      const o = i * 4;
      px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255;
    }
  }
}

function updateReadout(env){
  const a = ((Math.round(state.angle) % 360) + 360) % 360;
  let s = a + '°';
  if (state.mode === 'scan'){
    s += ' · slice ' + scanIndex(vol.n) + '/' + (vol.n - 1) +
      ' · front ' + sil.front + '% · back ' + sil.back + '%';
  } else if (state.mode === 'explode'){
    s += ' · gap ' + spread().toFixed(2) + ' · ' + vol.n + ' slices';
  } else {
    s += ' · squash ' + state.squash.toFixed(2) + ' · spacing ' + state.spacing.toFixed(2) +
      ' · sun ' + (Math.round(state.sun) % 360) + '°';
  }
  s += ' · ' + env.name + ' · ' + state.lastMs.toFixed(1) + ' ms';
  els.readout.textContent = s;
}

function walsyDrawFrame(){
  if (!vol || !artData) return;
  const t0 = performance.now();
  const px = artData.data;
  const env = envAt(state.time);
  const ang = state.angle * DEG;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const S = spread();
  const sr = state.sun * DEG;
  const L = { x: Math.cos(sr) * 0.82, y: -0.55, z: Math.sin(sr) * 0.82 };
  const m = Math.hypot(L.x, L.y, L.z) || 1;
  L.x /= m; L.y /= m; L.z /= m;
  background(px, env);
  solid.fill(0);
  glow.r.fill(0); glow.g.fill(0); glow.b.fill(0);
  groundPass(px, env, ca, sa, S);
  groundLine(px, env);
  if (state.mode === 'scan'){
    const midY = artH / 2;
    paintGhost(px, frontPx, ca, sa, 46, midY);
    paintGhost(px, backPx, ca, sa, 30, midY + 2);
  }
  const order = visibleSlices();
  for (let k = 0; k < order.length; k++) drawSlice(px, order[k].z, ca, sa, env, L, S);
  bloom(px);
  if (state.outline) outlinePass(px, env);
  artCtx.putImageData(artData, 0, 0);
  ctx.clearRect(0, 0, view.width, view.height);
  ctx.drawImage(art, 0, 0, artW, artH, 0, 0, view.width, view.height);
  els.stage.style.background = 'rgb(' + (env.bg[0] | 0) + ',' + (env.bg[1] | 0) + ',' + (env.bg[2] | 0) + ')';
  state.lastMs = performance.now() - t0;
  updateReadout(env);
}

let lastT = 0;
const keys = { up: false, down: false, left: false, right: false };
const KEYMAP = {
  w: 'up', W: 'up', ArrowUp: 'up',
  s: 'down', S: 'down', ArrowDown: 'down',
  a: 'left', A: 'left', ArrowLeft: 'left',
  d: 'right', D: 'right', ArrowRight: 'right'
};

function walsyTick(now){
  const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
  lastT = now;
  let moved = false;
  if (state.playing){
    state.angle = (state.angle + 46 * dt) % 360;
    moved = true;
  }
  if (keys.up || keys.down || keys.left || keys.right){
    if (keys.up) state.squash = clampN(state.squash + 0.9 * dt, 0.45, 1);
    if (keys.down) state.squash = clampN(state.squash - 0.9 * dt, 0.45, 1);
    if (keys.left) state.angle = (state.angle - 90 * dt + 360) % 360;
    if (keys.right) state.angle = (state.angle + 90 * dt) % 360;
    moved = true;
  }
  if (moved) state.dirty = true;
  if (state.dirty){
    walsyDrawFrame();
    state.dirty = false;
  }
  requestAnimationFrame(walsyTick);
}

function sync(){
  const deg = ((Math.round(state.angle) % 360) + 360) % 360;
  els.angle.value = String(deg);
  els.angleOut.textContent = deg + '°';
  els.squash.value = state.squash.toFixed(2);
  els.squashOut.textContent = state.squash.toFixed(2);
  els.spacing.value = state.spacing.toFixed(2);
  els.spacingOut.textContent = state.spacing.toFixed(2);
  els.scale.value = String(state.scale);
  els.scaleOut.textContent = state.scale + 'x';
  els.slices.value = String(state.slices);
  els.mode.value = state.mode;
  els.chkLight.checked = state.light;
  els.chkShadow.checked = state.shadow;
  els.chkOutline.checked = state.outline;
  els.time.value = String(state.time);
  els.timeOut.textContent = phaseName(state.time);
  els.sun.value = String(((Math.round(state.sun) % 360) + 360) % 360);
  els.sunOut.textContent = (((Math.round(state.sun) % 360) + 360) % 360) + '°';
  els.play.textContent = state.playing ? 'Pause' : 'Play';
  els.play.classList.toggle('playing', state.playing);
}

function togglePlay(){
  state.playing = !state.playing;
  state.dirty = true;
  sync();
}

function restart(){
  if (defaultSheet){
    sheetData = defaultSheet.data;
    sheetW = defaultSheet.width;
    sliceH = defaultSheet.height;
    payloadSlices = defaultSheet.slices;
    frontPx = defaultSheet.front;
    backPx = defaultSheet.back;
    els.file.value = '';
  }
  Object.assign(state, DEFAULTS, { slices: payloadSlices });
  panX = panY = 0;
  view.style.transform = '';
  keys.up = keys.down = keys.left = keys.right = false;
  lastT = 0;
  stopDrag();
  buildVolume();
  layout();
  sync();
  walsyDrawFrame();
}

els.play.addEventListener('click', togglePlay);
els.restart.addEventListener('click', restart);
els.angle.addEventListener('input', () => { state.angle = Number(els.angle.value); els.angleOut.textContent = Math.round(state.angle) + '°'; state.dirty = true; });
els.squash.addEventListener('input', () => { state.squash = Number(els.squash.value); els.squashOut.textContent = Number(els.squash.value).toFixed(2); state.dirty = true; });
els.spacing.addEventListener('input', () => {
  state.spacing = Number(els.spacing.value);
  els.spacingOut.textContent = Number(els.spacing.value).toFixed(2);
  layout();
});
els.scale.addEventListener('input', () => {
  state.scale = Number(els.scale.value);
  els.scaleOut.textContent = state.scale + 'x';
  resize();
});
els.stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const before = state.scale;
  const after = clampN(before + (e.deltaY < 0 ? 1 : -1), 2, 14);
  if (after === before) return;
  const r = view.getBoundingClientRect();
  const ax = (e.clientX - r.left) / before, ay = (e.clientY - r.top) / before;
  state.scale = after;
  resize();
  const r2 = view.getBoundingClientRect();
  panX += e.clientX - (r2.left + ax * after);
  panY += e.clientY - (r2.top + ay * after);
  view.style.transform = 'translate(' + panX + 'px,' + panY + 'px)';
  els.scale.value = String(after);
  els.scaleOut.textContent = after + 'x';
}, { passive: false });
els.slices.addEventListener('change', () => {
  state.slices = clampN(parseInt(els.slices.value, 10) || payloadSlices, 1, 256);
  els.slices.value = String(state.slices);
  buildVolume();
  layout();
});
els.time.addEventListener('input', () => {
  state.time = Number(els.time.value);
  els.timeOut.textContent = phaseName(state.time);
  state.dirty = true;
});
els.sun.addEventListener('input', () => {
  state.sun = Number(els.sun.value);
  els.sunOut.textContent = Math.round(state.sun) + '°';
  state.dirty = true;
});
els.mode.addEventListener('change', () => {
  state.mode = els.mode.value;
  layout();
});
els.chkLight.addEventListener('change', () => { state.light = els.chkLight.checked; state.dirty = true; });
els.chkShadow.addEventListener('change', () => { state.shadow = els.chkShadow.checked; state.dirty = true; });
els.chkOutline.addEventListener('change', () => { state.outline = els.chkOutline.checked; state.dirty = true; });

els.file.addEventListener('change', async () => {
  const f = els.file.files && els.file.files[0];
  if (!f) return;
  try {
    const img = await loadImage(URL.createObjectURL(f));
    const raw = pixels(img);
    if (sliceW < 1 || raw.width % sliceW !== 0) throw new Error('width must be a multiple of ' + sliceW + 'px');
    sheetData = raw.data;
    sheetW = raw.width;
    sliceH = raw.height;
    payloadSlices = Math.max(1, Math.round(raw.width / sliceW));
    state.slices = payloadSlices;
    els.slices.value = String(payloadSlices);
    buildVolume();
    layout();
  } catch (err){
    els.readout.textContent = 'Load failed: ' + err.message;
  }
});

function exportStrip(){
  if (!vol) return;
  const keepAngle = state.angle, keepPlaying = state.playing;
  state.playing = false;
  const strip = document.createElement('canvas');
  strip.width = artW * 16;
  strip.height = artH;
  const sc = strip.getContext('2d');
  for (let i = 0; i < 16; i++){
    state.angle = i * 22.5;
    walsyDrawFrame();
    sc.putImageData(artCtx.getImageData(0, 0, artW, artH), i * artW, 0);
  }
  const name = (EMBEDDED && EMBEDDED.title) || 'walsy-3d-turntable';
  const a = document.createElement('a');
  a.download = name + '-16dir.png';
  a.href = strip.toDataURL('image/png');
  a.click();
  state.angle = keepAngle;
  state.playing = keepPlaying;
  state.dirty = true;
  sync();
  walsyDrawFrame();
}
els.export.addEventListener('click', exportStrip);

let drag = null;
function stopDrag(){
  if (!drag) return;
  drag = null;
  view.classList.remove('dragging');
}
view.addEventListener('pointerdown', (e) => {
  state.playing = false;
  sync();
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, angle: state.angle, sun: state.sun, squash: state.squash, shift: e.shiftKey };
  view.setPointerCapture(e.pointerId);
  view.classList.add('dragging');
  e.preventDefault();
});
view.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (drag.shift || e.shiftKey){
    state.sun = ((drag.sun + dx * 0.7) % 360 + 360) % 360;
  } else {
    state.angle = ((drag.angle + dx * 0.7) % 360 + 360) % 360;
  }
  state.squash = clampN(drag.squash - dy * 0.004, 0.45, 1);
  sync();
  state.dirty = true;
});
view.addEventListener('pointerup', stopDrag);
view.addEventListener('pointercancel', stopDrag);
view.addEventListener('lostpointercapture', stopDrag);

function typing(e){
  const t = e.target;
  return !!t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON' || t.isContentEditable);
}

window.addEventListener('keydown', (e) => {
  if (typing(e)) return;
  if (e.code === 'Space' || e.key === ' '){
    e.preventDefault();
    togglePlay();
    return;
  }
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  if (!keys[k]){
    keys[k] = true;
    if (k === 'left' || k === 'right') state.playing = false;
    sync();
    state.dirty = true;
  }
});
window.addEventListener('keyup', (e) => {
  const k = KEYMAP[e.key];
  if (k) keys[k] = false;
});
window.addEventListener('blur', () => {
  keys.up = keys.down = keys.left = keys.right = false;
});

async function boot(){
  const data = EMBEDDED || {};
  sliceW = data.sliceWidth | 0;
  sliceH = data.sliceHeight | 0;
  payloadSlices = data.slices | 0;
  if (!(sliceW > 0 && sliceH > 0 && payloadSlices > 0)) throw new Error('payload missing');
  const imgs = await Promise.all([loadImage(data.sheet), loadImage(data.front), loadImage(data.back)]);
  if (!imgs[0]) throw new Error('sheet missing');
  const raw = pixels(imgs[0]);
  if (raw.width !== sliceW * payloadSlices || raw.height !== sliceH) throw new Error('sheet size mismatch');
  sheetData = raw.data;
  sheetW = raw.width;
  frontPx = imgs[1] ? pixels(imgs[1]) : null;
  backPx = imgs[2] ? pixels(imgs[2]) : null;
  defaultSheet = { data: raw.data, width: raw.width, height: raw.height, slices: payloadSlices, front: frontPx, back: backPx };
  const title = data.title || 'walsy-3d Turntable';
  els.title.textContent = title;
  document.title = title;
  state.slices = payloadSlices;
  els.slices.value = String(payloadSlices);
  buildVolume();
  layout();
  sync();
  walsyDrawFrame();
}

boot().catch(err => { els.readout.textContent = 'Load failed: ' + err.message; });
requestAnimationFrame(walsyTick);
</script>
</body>
</html>
