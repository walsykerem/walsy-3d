[package]
name = "scripts-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "walsy-3d carving, preview and viewer core"

[dependencies]
zlib-rs = "0.6"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
